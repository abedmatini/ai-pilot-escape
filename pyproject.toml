[project]
name = "hybrid-ai-talk"
version = "0.1.0"
description = "Conference talk + live demo: hybrid local-to-cloud AI routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.63.0,<2",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
hybrid-router = "demo.router:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["demo*"]
